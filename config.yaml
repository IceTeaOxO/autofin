# Data Engine Configuration

# Database settings
database:
  path: "data/autofin.db"

# Asset pools to track
asset_pools:
  us_tech:
    tickers: ["AAPL", "MSFT", "NVDA", "GOOGL", "AMD", "TSLA"]
  us_indices:
    tickers: ["SPY", "QQQ", "DIA"]
  us_financials:
    tickers: ["JPM", "V", "MA"]
  us_healthcare_consumer:
    tickers: ["JNJ", "PFE", "PG", "KO"]
  us_energy_industrial:
    tickers: ["XOM", "CVX", "CAT", "LNG", "NXE"]
  network:
    tickers: ["AVGO", "MRVL"]  
  japan:
    tickers: ["EWJ"]  
  crypto:
    tickers: ["BTC-USD", "ETH-USD"]

# Processing flags
processing:
  log_returns: true
  lookback_days: 120 # Increased for 60-day momentum & FracDiff burn-in

# Factor settings
factors:
  momentum:
    windows: [20, 60]
  mean_reversion:
    window: 20
  volatility:
    window: 30
  frac_diff:
    dynamic_d: true # Use find_optimal_d
    default_d: 0.4
  neutralize: true
  scoring:
    enabled: true
    method: "rank" # Options: "rank", "zscore"
  rebalance_threshold: 0.05 # 5% change required to trade
